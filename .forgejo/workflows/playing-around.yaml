on:
  push:
    branches:
      - stage
jobs:
  build:
    runs-on: docker
    environment: ${{ env.FORGEJO_REF_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: https://code.forgejo.org/actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build Astro project
        run: npm run build
